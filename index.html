<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 | 김기덕</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<script src="data_profile.js"></script>
<script src="data_portfolio.js"></script>
<script src="data_study.js"></script>
<script src="data_games.js"></script>
<script>
const DATA = { site: PROFILE_DATA.site, landing: PROFILE_DATA.landing, about: PROFILE_DATA.about, portfolio: PORTFOLIO_DATA, studies: STUDY_DATA, games: GAMES_DATA };
</script>

<nav id="main-nav">
  <div class="nav-inner">
    <div class="nav-logo active" onclick="switchPage('home')" id="nav-logo-home">HOME</div>
    <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="navLinks">
      <li><button class="page-link" onclick="switchPage('portfolio')" data-target="portfolio">Portfolio</button></li>
      <li><button class="page-link" onclick="switchPage('study')" data-target="study">Study</button></li>
      <li><button class="page-link" onclick="switchPage('games')" data-target="games">Playlist</button></li>
      <li><button class="page-link" onclick="switchPage('about')" data-target="about">About me</button></li>
    </ul>
  </div>
</nav>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="detail-modal" class="modal">
  <div class="modal-header">
    <div style="width: 100%; max-width: 1440px; display: flex; justify-content: space-between; align-items: center;">
      <div id="modal-top-title" style="font-size: 16px; font-weight: 800; letter-spacing: 0.15em; color: var(--fg-main);">PORTFOLIO</div>
      <button class="modal-close" onclick="closeModal()">✕ 돌아가기</button>
    </div>
    <div class="modal-reading-progress" id="reading-progress"></div>
  </div>
  <div class="modal-body" id="modal-body" onscroll="updateReadingProgress(this)"></div>
</div>

<div id="page-container">

  <section class="page active" id="page-home">
    <div id="hero-slider"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-desc" id="hero-desc"></p>
      <button class="btn-primary" onclick="switchPage('portfolio')">포트폴리오 보기 <span>→</span></button>
    </div>
  </section>

  <section class="page" id="page-portfolio">
    <div class="page-inner">
      <h2 class="sec-title">Level Design Portfolio</h2>
      <div id="portfolio-list"></div>
      <div class="global-footer">© 2026 Kim Ki Deok. Level Designer.</div>
    </div>
  </section>

  <section class="page" id="page-study">
    <div class="page-inner">
      <h2 class="sec-title">Study & Research</h2>
      <div class="study-list" id="study-list"></div>
      <div class="global-footer">© 2026 Kim Ki Deok. Level Designer.</div>
    </div>
  </section>

  <section class="page" id="page-games">
    <div class="page-inner">
      <h2 class="sec-title" style="margin-bottom: 24px;">Game PlayList</h2>
      <div class="game-filter-wrap" id="game-filter-wrap">
        <button class="filter-btn active" onclick="renderGames('sort', 'latest')">최신발매순</button>
        <button class="filter-btn" onclick="renderGames('sort', 'playtime')">플레이타임순</button>
        <button class="filter-btn" onclick="renderGames('sort', 'genre')">장르 그룹보기</button>
        <div style="width: 2px; height: 24px; background: rgba(255,255,255,0.1); margin: 10px 8px;"></div>
        <button class="filter-btn" style="color:#E03030; border-color:rgba(224,48,48,0.4);" onclick="renderGames('tag', '액션')">#액션</button>
        <button class="filter-btn" style="color:#E03030; border-color:rgba(224,48,48,0.4);" onclick="renderGames('tag', 'RPG')">#RPG</button>
        <button class="filter-btn" style="color:#E03030; border-color:rgba(224,48,48,0.4);" onclick="renderGames('tag', '슈팅')">#슈팅</button>
        <button class="filter-btn" style="color:#E03030; border-color:rgba(224,48,48,0.4);" onclick="renderGames('tag', '오픈월드')">#오픈월드</button>
        <button class="filter-btn" style="color:#E03030; border-color:rgba(224,48,48,0.4);" onclick="renderGames('tag', '소울라이크')">#소울라이크</button>
        <button class="filter-btn" style="color:#E03030; border-color:rgba(224,48,48,0.4);" onclick="renderGames('tag', '크래프팅')">#크래프팅</button>
      </div>
      <div class="game-list" id="game-list"></div>
      <div class="global-footer">© 2026 Kim Ki Deok. Level Designer.</div>
    </div>
  </section>

  <section class="page" id="page-about">
    <div class="page-inner">
      <h2 class="sec-title">About Me</h2>
      <div class="about-grid">
        <div class="modern-card about-box">
          <p class="about-lead" id="about-lead"></p>
          <p class="about-body" id="about-body"></p>
          
          <div class="exp-section">
            <h3 style="font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 24px;">EXPERIENCE</h3>
            <div id="about-exp"></div>
          </div>
          
          <div class="exp-section" style="margin-top: 60px;">
            <h3 style="font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 24px;">SKILL</h3>
            <div id="about-skills" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;"></div>
          </div>
          
        </div>
        <div class="modern-card contact-box" style="padding: 48px;">
          <h3>Contact</h3>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </div>
      <div class="global-footer">© 2026 Kim Ki Deok. Level Designer.</div>
    </div>
  </section>

</div>

<script src="main.js"></script>
</body>
</html>
